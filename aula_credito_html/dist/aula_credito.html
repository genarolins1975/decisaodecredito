<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelagem de crédito: logit, árvore e boosting</title>
<meta name="description" content="Aula interativa de 50 slides sobre regressão logística, árvore de decisão e gradient boosting aplicados à concessão de crédito pessoal.">
<style>
/* Sistema visual da aula de modelagem de crédito.
   Tokens da plataforma Laboratório de Decisão de Crédito mais as três cores de
   identidade de modelo definidas no guia de design da aula. Tema único, claro. */

:root {
  --ground: #F5F4F0;
  --paper: #FBFAF7;
  --surface: #FFFFFF;
  --ink: #00205B;
  --ink-soft: #3D5A8A;
  --body: #24313D;
  --muted: #5B6475;
  --rule: #E2DFD6;
  --gold: #C9A84C;
  --gold-soft: #F4ECD6;
  --amber: #B8640F;
  --alert: #8C2332;
  --alert-soft: #FBF2F3;
  --ok: #2E6B4F;
  --ok-soft: #F0F7F3;
  --dots: #C9D8F2;

  --logit: #2457A6;
  --logit-soft: #EAF0FA;
  --arvore: #127C80;
  --arvore-soft: #E7F3F3;
  --boost: #6B4EA0;
  --boost-soft: #F1ECF9;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: Inter, system-ui, "Segoe UI", Aptos, Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --cor: var(--ink);
  --cor-soft: #EFF3FA;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ground);
  color: var(--body);
  font-family: var(--sans);
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body[data-bloco="logit"] { --cor: var(--logit); --cor-soft: var(--logit-soft); }
body[data-bloco="arvore"] { --cor: var(--arvore); --cor-soft: var(--arvore-soft); }
body[data-bloco="boosting"] { --cor: var(--boost); --cor-soft: var(--boost-soft); }
body[data-bloco="problema"] { --cor: var(--ink); --cor-soft: #EFF3FA; }
body[data-bloco="decisao"] { --cor: var(--amber); --cor-soft: #FBF1E3; }

/* ------------------------------------------------------------------ palco */

#moldura {
  position: fixed;
  inset: 0 0 58px 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#palco {
  flex: 0 0 auto;
  width: 1600px;
  height: 900px;
  background: var(--ground);
  transform-origin: center center;
  display: flex;
  flex-direction: column;
  padding: 34px 54px 22px;
  position: relative;
}

.cabeca { flex: 0 0 auto; }

.trilho {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--cor);
  display: flex;
  gap: 14px;
  align-items: baseline;
}
.trilho .passo { color: var(--muted); font-weight: 400; letter-spacing: .02em; text-transform: none; }

h1.titulo {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 46px;
  line-height: 1.1;
  color: var(--ink);
  margin: 6px 0 0;
  text-wrap: balance;
}
p.subtitulo {
  font-size: 24px;
  color: var(--muted);
  margin: 6px 0 0;
}

#corpo {
  flex: 1 1 auto;
  min-height: 0;
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  font-size: 22px;
}

.rodape {
  flex: 0 0 auto;
  border-top: 1px solid var(--rule);
  margin-top: 12px;
  padding-top: 9px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 24px;
}
.conclusao {
  margin: 0;
  font-family: var(--serif);
  font-size: 25px;
  color: var(--ink);
  font-weight: 700;
}
.fonte { margin: 0; font-size: 18px; color: var(--muted); white-space: nowrap; }

/* --------------------------------------------------------------- estrutura */

.linha { display: flex; gap: 20px; align-items: stretch; }
.linha.topo { align-items: flex-start; }
.coluna { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cresce { flex: 1 1 auto; min-width: 0; min-height: 0; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.centro { display: flex; flex-direction: column; align-items: center; justify-content: center; }

.painel {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 16px 18px;
}
.painel.claro { background: var(--surface); }
.painel.cor { background: var(--cor-soft); border-color: color-mix(in srgb, var(--cor) 28%, var(--rule)); }
.painel > h2, .painel > h3 { margin: 0 0 8px; }

h2.secao {
  font-family: var(--serif);
  font-size: 26px;
  color: var(--ink);
  margin: 0 0 8px;
  font-weight: 700;
}
h3.secao {
  font-size: 20px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 8px;
  font-weight: 700;
}

p { margin: 0 0 8px; }
p:last-child { margin-bottom: 0; }
.apoio { font-size: 20px; color: var(--muted); }
.nota { font-size: 18px; color: var(--muted); }
strong { color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }
.destaque { color: var(--cor); font-weight: 700; }
.grande {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 44px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.medio {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 30px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.selo {
  display: inline-block;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 3px 9px;
  border-radius: 3px;
  background: var(--gold-soft);
  color: #6b5411;
  border: 1px solid #e3d5a8;
  white-space: nowrap;
}
.selo.sim { background: var(--alert-soft); color: var(--alert); border-color: #e9c9ce; }
.selo.ok { background: var(--ok-soft); color: var(--ok); border-color: #c8e0d3; }
.selo.neutro { background: var(--surface); color: var(--muted); border-color: var(--rule); }

.formula {
  font-family: var(--serif);
  font-size: 28px;
  color: var(--ink);
  background: var(--cor-soft);
  border-left: 3px solid var(--cor);
  padding: 10px 16px;
  border-radius: 0 4px 4px 0;
  font-variant-numeric: tabular-nums;
}
.formula.peq { font-size: 22px; padding: 7px 12px; }
.formula.gg { font-size: 34px; }

/* --------------------------------------------------------------- controles */

.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl > label { font-size: 19px; color: var(--muted); font-weight: 700; }
.ctrl-linha { display: flex; align-items: center; gap: 12px; }
.ctrl input[type="range"] {
  flex: 1 1 auto;
  min-width: 120px;
  accent-color: var(--cor);
  height: 26px;
}
.ctrl input[type="number"], .ctrl input[type="text"] {
  width: 104px;
  font: 700 21px var(--sans);
  font-variant-numeric: tabular-nums;
  padding: 5px 8px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
}
.ctrl .unidade { font-size: 19px; color: var(--muted); }

.btn {
  font: 700 20px var(--sans);
  padding: 8px 15px;
  border-radius: 4px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.btn:hover { border-color: var(--cor); }
.btn.sel { background: var(--cor); border-color: var(--cor); color: #fff; }
.btn.min { font-size: 18px; padding: 6px 11px; }
.btn.bloco { display: block; width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.fantasma { background: transparent; border-color: transparent; color: var(--ink-soft); text-decoration: underline; }

.grupo { display: flex; gap: 8px; flex-wrap: wrap; }
.grupo.vert { flex-direction: column; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

/* ---------------------------------------------------------------- tabelas */

table.tabela {
  width: 100%;
  border-collapse: collapse;
  font-size: 21px;
  font-variant-numeric: tabular-nums;
}
table.tabela th, table.tabela td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--rule);
  text-align: right;
}
table.tabela th:first-child, table.tabela td:first-child { text-align: left; }
table.tabela thead th {
  font-size: 18px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  border-bottom: 2px solid var(--rule);
  vertical-align: bottom;
}
table.tabela tbody tr.sel { background: var(--cor-soft); }
table.tabela tbody tr.sel td { font-weight: 700; color: var(--ink); }
table.tabela td.rotulo { font-weight: 700; color: var(--ink); }
table.tabela.compacta { font-size: 19px; }
table.tabela.compacta th, table.tabela.compacta td { padding: 5px 8px; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 20px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* -------------------------------------------------------------- respostas */

.resposta {
  border-left: 3px solid var(--ok);
  background: var(--ok-soft);
  padding: 10px 14px;
  border-radius: 0 4px 4px 0;
  font-size: 20px;
}
.resposta.erro { border-color: var(--alert); background: var(--alert-soft); }
.resposta.neutra { border-color: var(--muted); background: var(--paper); }

.alternativa {
  display: block;
  width: 100%;
  text-align: left;
  font: 400 21px var(--sans);
  padding: 10px 14px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--surface);
  cursor: pointer;
  color: var(--body);
}
.alternativa.sel { border-color: var(--cor); border-width: 2px; background: var(--cor-soft); }
.alternativa .letra {
  font-weight: 700;
  color: var(--cor);
  margin-right: 8px;
}
.alternativa.certa { border-color: var(--ok); background: var(--ok-soft); }
.alternativa.errada { border-color: var(--alert); background: var(--alert-soft); }

/* ------------------------------------------------------------------- svg */

svg { display: block; overflow: visible; }
svg text { font-family: var(--sans); fill: var(--body); }
.eixo line, .eixo path { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.eixo text { fill: var(--muted); font-size: 18px; }
.eixo .rotulo { fill: var(--muted); font-size: 19px; font-weight: 700; }
.grade line { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 4; }
.serie { fill: none; stroke-width: 3; }
.marca { font-size: 19px; font-weight: 700; }

/* ------------------------------------------------------------------ barra */

#barra {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 58px;
  background: var(--surface);
  border-top: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  z-index: 20;
}
#barra .id { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); font-size: 15px; }
#barra .titulinho {
  color: var(--muted);
  font-size: 14px;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#barra button {
  font: 700 14px var(--sans);
  padding: 7px 11px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
#barra button:hover { border-color: var(--ink); }
#barra button.ativo { background: var(--ink); color: #fff; border-color: var(--ink); }
#progresso { height: 3px; background: var(--rule); position: fixed; left: 0; bottom: 58px; z-index: 21; }
#progresso i { display: block; height: 100%; background: var(--cor); }

#notas {
  position: fixed;
  right: 0; top: 0; bottom: 58px;
  width: 430px;
  background: var(--surface);
  border-left: 3px solid var(--gold);
  padding: 18px 20px 24px;
  overflow: auto;
  z-index: 19;
  font-size: 15px;
  line-height: 1.5;
}
#notas h2 { font-family: var(--serif); font-size: 19px; color: var(--ink); margin: 0 0 10px; }
#notas h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 16px 0 5px;
}
#notas p, #notas li { color: var(--body); margin: 0 0 7px; }
#notas ul { margin: 0; padding-left: 18px; }

#indice {
  position: fixed;
  inset: 0;
  background: rgba(245, 244, 240, .97);
  z-index: 30;
  overflow: auto;
  padding: 26px 30px 80px;
}
#indice h2 { font-family: var(--serif); color: var(--ink); margin: 0 0 4px; font-size: 22px; }
.indice-bloco { margin-bottom: 18px; }
.indice-bloco > h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 0 0 8px; border-bottom: 1px solid var(--rule); padding-bottom: 4px;
}
.indice-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 6px; }
.indice-lista a {
  display: flex; gap: 9px; text-decoration: none; color: var(--body);
  padding: 5px 8px; border-radius: 4px; font-size: 14px; border: 1px solid transparent;
}
.indice-lista a:hover { background: var(--surface); border-color: var(--rule); }
.indice-lista a b { color: var(--ink); font-variant-numeric: tabular-nums; }
.indice-lista a.atual { background: var(--cor-soft); border-color: var(--cor); }

[hidden] { display: none !important; }
.oculto-visual {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ------------------------------------------------------------ modo estudo */

body.estudo #moldura {
  position: static;
  display: block;
  overflow: visible;
  height: auto;
}
body.estudo #palco {
  width: auto;
  max-width: 1180px;
  height: auto;
  margin: 0 auto 70px;
  transform: none !important;
  padding: 22px 18px 24px;
}
body.estudo #corpo { font-size: 17px; }
body.estudo h1.titulo { font-size: 30px; }
body.estudo p.subtitulo { font-size: 17px; }
body.estudo .trilho { font-size: 13px; }
body.estudo .conclusao { font-size: 19px; }
body.estudo .fonte { font-size: 13px; white-space: normal; }
body.estudo .linha { flex-wrap: wrap; }
body.estudo .g2, body.estudo .g3, body.estudo .g4 { grid-template-columns: 1fr; }
body.estudo .grande { font-size: 32px; }
body.estudo .medio { font-size: 24px; }
body.estudo .formula { font-size: 19px; }
body.estudo .formula.gg { font-size: 22px; }
body.estudo table.tabela { font-size: 15px; }
body.estudo table.tabela th, body.estudo table.tabela td { padding: 5px 6px; }
body.estudo .apoio { font-size: 15px; }
body.estudo .nota, body.estudo .selo { font-size: 13px; }
body.estudo h2.secao { font-size: 19px; }
body.estudo h3.secao { font-size: 14px; }
body.estudo .btn { font-size: 15px; padding: 6px 10px; }
body.estudo .alternativa { font-size: 15px; }
body.estudo .ctrl > label { font-size: 14px; }
body.estudo .resposta { font-size: 15px; }
body.estudo .kv { font-size: 15px; }
body.estudo svg { max-width: 100%; height: auto; }
body.estudo .estudo-notas {
  max-width: 1180px;
  margin: 0 auto 60px;
  padding: 0 18px;
}
body.estudo .estudo-notas .painel { margin-bottom: 12px; }

/* ---------------------------------------------------------------- impressão */

#impressao { display: none; }

@media print {
  #moldura, #barra, #notas, #indice, #progresso { display: none !important; }
  body { background: #fff; }
  #impressao { display: block; }
  .folha {
    page-break-after: always;
    break-after: page;
    padding: 12mm 14mm;
    width: 297mm;
    min-height: 200mm;
  }
  .folha .titulo { font-size: 26px; }
  .folha .subtitulo { font-size: 14px; }
  .folha #corpo, .folha .corpo { font-size: 13px; }
  .folha .grande { font-size: 24px; }
  .folha .medio { font-size: 18px; }
  .folha .formula { font-size: 15px; }
  .folha table.tabela { font-size: 12px; }
  .folha .apoio { font-size: 12px; }
  .folha .nota, .folha .selo { font-size: 11px; }
  .folha .btn, .folha input[type="range"] { display: none; }
  .folha .grupo.imprime .btn { display: inline-block; }
  @page { size: A4 landscape; margin: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="moldura">
  <div id="palco"></div>
</div>
<div id="progresso" style="width:100%"><i id="progresso-barra" style="width:0"></i></div>
<nav id="barra" aria-label="navegação da aula">
  <span class="id" id="rotulo-id">01/50</span>
  <span class="titulinho" id="rotulo-titulo"></span>
  <button type="button" id="btn-indice" aria-haspopup="dialog">Índice</button>
  <button type="button" id="btn-anterior" aria-label="slide anterior">Anterior</button>
  <button type="button" id="btn-proximo" aria-label="próximo slide">Próximo</button>
  <button type="button" id="btn-professor" aria-pressed="false">Professor</button>
  <button type="button" id="btn-estudo" aria-pressed="false">Estudo</button>
  <button type="button" id="btn-tela">Tela cheia</button>
  <button type="button" id="btn-imprimir">Imprimir</button>
</nav>
<aside id="notas" hidden aria-label="notas do professor"></aside>
<div id="indice" hidden role="dialog" aria-label="índice dos 50 slides">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h2>Os 50 slides da aula</h2>
    <button type="button" id="btn-fechar-indice" class="btn min">Fechar</button>
  </div>
  <div id="indice-lista"></div>
</div>
<div id="impressao"></div>
<script>
/* nucleo/01-nucleo.js */
/* Núcleo da aula: registro de slides, formatação numérica e funções matemáticas
   compartilhadas. Todo valor exibido na tela vem daqui ou dos objetos de dados;
   nenhum número é digitado duas vezes em lugares diferentes. */

var Aula = (function () {
  var slides = [];
  var registro = {};

  function slide(def) {
    if (registro[def.id]) throw new Error("slide duplicado: " + def.id);
    registro[def.id] = def;
    slides.push(def);
    return def;
  }

  return {
    slides: slides,
    registro: registro,
    slide: slide,
    dados: {},
    resultados: null,
  };
})();

/* ------------------------------------------------------------- formatação */

var F = (function () {
  var MENOS = "−"; // sinal de menos, nunca hífen

  function trocaMenos(s) {
    return String(s).replace(/-/g, MENOS);
  }

  function dec(x, casas) {
    if (x === null || x === undefined || !isFinite(x)) return "indisponível";
    casas = casas === undefined ? 2 : casas;
    var s = Math.abs(x).toFixed(casas).replace(".", ",");
    return (x < 0 ? MENOS : "") + s;
  }

  function sinal(x, casas) {
    if (!isFinite(x)) return "indisponível";
    var s = dec(Math.abs(x), casas);
    return (x < 0 ? MENOS : "+") + s;
  }

  function pct(p, casas) {
    casas = casas === undefined ? 2 : casas;
    return dec(p * 100, casas) + "%";
  }

  function pp(x, casas) {
    casas = casas === undefined ? 2 : casas;
    return dec(x * 100, casas) + " p.p.";
  }

  function ppSinal(x, casas) {
    casas = casas === undefined ? 2 : casas;
    return sinal(x * 100, casas) + " p.p.";
  }

  function reais(x, casas) {
    casas = casas === undefined ? 0 : casas;
    var s = Math.abs(x).toFixed(casas);
    var partes = s.split(".");
    partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return "R$ " + (x < 0 ? MENOS : "") + partes.join(",");
  }

  function inteiro(x) {
    return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  function mes(iso) {
    var nomes = ["jan", "fev", "mar", "abr", "mai", "jun",
                 "jul", "ago", "set", "out", "nov", "dez"];
    var p = String(iso).split("-");
    return nomes[parseInt(p[1], 10) - 1] + "/" + p[0];
  }

  return {
    MENOS: MENOS, trocaMenos: trocaMenos, dec: dec, sinal: sinal, pct: pct,
    pp: pp, ppSinal: ppSinal, reais: reais, inteiro: inteiro, mes: mes,
  };
})();

/* ------------------------------------------------------------- matemática */

var M = (function () {
  function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
  function logito(p) { return Math.log(p / (1 - p)); }
  function odds(p) { return p / (1 - p); }
  function pDeOdds(o) { return o / (1 + o); }

  /* PD depois de multiplicar as odds por r, sem passar por arredondamento. */
  function porRazaoDeOdds(p, r) {

  titulo: "O que sabemos no momento da proposta?",
  subtitulo: "Seis características por cliente, com unidade e momento de observação",
  conclusao: "Cada variável descreve uma dimensão do risco. Nenhuma decide sozinha.",
  fonte: Aula.dados.fontes.conceito,
  resumo: "Tabela de quatro clientes por seis características, com ficha ampliada do cliente selecionado.",
  notas: {
    conducao: [
      "Compare primeiro a renda de Carla e a de Bruno. Depois revele comprometimento e utilização.",
      "Contraste relacionamento e histórico por último.",
      "Pergunte: qual combinação parece mais informativa que uma variável isolada? Aceite hipóteses diferentes.",
    ],
    cuidados: [
      "Canal não é efeito causal nem evidência de qualidade moral. Uma variável útil para previsão pode refletir seleção.",
      "Comprometimento é a parcela total mensal já incluindo a nova operação, dividida pela renda verificada.",
      "Histórico registra atraso de 15 a 89 dias no passado. Não é inadimplência corrente.",
      "As unidades serão preservadas em toda a aula, especialmente percentual contra fração.",

    var D = Aula.dados;
    var est = ctx.estado;
    if (!est.sel) est.sel = "Ana";
    if (!est.coluna) est.coluna = null;
    if (est.comparar === undefined) est.comparar = false;

    var cliente = D.cliente(est.sel);

    var tabela = Comum.tabelaClientes({ selecionado: est.sel });
    // Nome clicável realça a linha; cabeçalho abre a explicação da coluna.
    [].forEach.call(tabela.querySelectorAll("tbody tr"), function (tr, i) {
      var nome = D.clientes[i].nome;
      var celula = tr.firstChild;
      var b = h("button", { class: "btn fantasma min", type: "button",
        estilo: "padding:0;text-decoration:none;font-size:21px",
        onclick: function () { est.sel = nome; App.montar("02"); } }, nome);
      limpar(celula).appendChild(b);
    });
    [].forEach.call(tabela.querySelectorAll("thead th"), function (th, j) {
      if (j === 0) return;
      var campo = D.dicionario[j - 1];
      var b = h("button", { class: "btn fantasma min", type: "button",
        estilo: "padding:0;text-align:right;font:inherit;color:inherit;text-decoration:none",
        onclick: function () { est.coluna = campo.campo; App.montar("02"); } },
        [campo.nome, h("br"), h("span", { estilo: "font-weight:400;text-transform:none" }, campo.unidade)]);
      limpar(th).appendChild(b);
      th.classList.toggle("sel", est.coluna === campo.campo);
      if (est.coluna === campo.campo) th.setAttribute("style", "background:var(--cor-soft)");
    });
    if (est.coluna) {
      var j = D.dicionario.map(function (d) { return d.campo; }).indexOf(est.coluna) + 1;
      [].forEach.call(tabela.querySelectorAll("tbody tr"), function (tr) {
        tr.children[j].setAttribute("style", "background:var(--cor-soft);font-weight:700");
      });
    }

    var explicacao = h("div", { class: "painel cor" });
    if (est.coluna) {
      var d = D.dicionario.filter(function (x) { return x.campo === est.coluna; })[0];
      explicacao.appendChild(h("h3", { class: "secao" }, d.nome + " (" + d.unidade + ")"));
      explicacao.appendChild(h("p", { class: "apoio" }, d.descricao));
      explicacao.appendChild(h("p", { class: "nota" }, d.disponibilidade));
    } else {
      explicacao.appendChild(h("h3", { class: "secao" }, "Dicionário"));
      explicacao.appendChild(h("p", { class: "apoio" },
        "Selecione um cabeçalho para ver unidade, definição e momento de observação da variável."));
    }

    var direita;
    if (est.comparar) {
      var a = D.cliente(est.parA || "Carla"), b2 = D.cliente(est.parB || "Bruno");
      var campos = ["renda", "comp", "rel", "util", "hist", "canal"];
      var linhas = campos.map(function (k) {
        var dd = D.dicionario.filter(function (x) { return x.campo === k; })[0];
        function fmt(c) {
          if (k === "renda") return F.inteiro(c.renda);
          if (k === "hist") return c.hist ? "sim" : "não";
          if (k === "canal") return c.canal;
          return F.dec(c[k], 0);
        }
        var dif = (k === "canal" || k === "hist")
          ? (a[k] === b2[k] ? "igual" : "diferente")
          : F.sinal(a[k] - b2[k], 0);
        return [dd.nome + " (" + dd.unidade + ")", fmt(a), fmt(b2), dif];
      });
      direita = h("div", { class: "coluna" }, [
        h("div", { class: "painel" }, [
          h("h3", { class: "secao" }, "Comparar dois clientes"),
          h("div", { class: "grupo" }, [
            Comum.seletorCliente(a.nome, function (v) { est.parA = v; App.montar("02"); }, { compacto: true }),
            h("span", { class: "apoio" }, "contra"),
            Comum.seletorCliente(b2.nome, function (v) { est.parB = v; App.montar("02"); }, { compacto: true }),
          ]),
          UI.tabela({
            compacta: true,
            colunas: [{ rotulo: "Característica" }, { rotulo: a.nome }, { rotulo: b2.nome },
                      { rotulo: "Diferença" }],
            linhas: linhas,
            legenda: "Comparação de dois perfis, valores originais lado a lado",
          }),
          h("p", { class: "nota" },
            "A comparação mostra os valores originais. Não gera escore, peso ou ranking."),
        ]),
      ]);
    } else {
      direita = h("div", { class: "coluna" }, [
        Comum.ficha(cliente, { cor: true, rodape: "Perfil fictício, elegível, sem desfecho revelado." }),
        explicacao,
      ]);
    }

    corpo.appendChild(h("div", { class: "linha topo cresce" }, [
      h("div", { class: "coluna cresce" }, [
        h("div", { class: "painel claro" }, tabela),
        h("div", { class: "grupo" }, [
          UI.alterna({
            rotulo: "Comparar dois clientes", valor: est.comparar,
            ligadoRotulo: "Voltar à ficha individual",
            desligadoRotulo: "Comparar dois clientes",
            aoMudar: function (v) { est.comparar = v; App.montar("02"); },
          }),
          h("button", { class: "btn fantasma", type: "button", onclick: ctx.reiniciar },
            "Reiniciar exemplo"),
        ]),
      ]),
      h("div", { estilo: "flex:0 0 470px" }, direita),
    ]));
  },
});


/* slides/s03.js */
Aula.slide({
  id: "03",
  bloco: "problema",
  titulo: "Probabilidade de quê, para quem e até quando?",
  subtitulo: "Atraso superior a 90 dias em qualquer momento dos 12 meses após a contratação",
  conclusao: "Sem a mesma definição de inadimplência, duas PDs não são comparáveis.",
  fonte: "Trajetórias ilustrativas de contratos fictícios; cálculo próprio",
  resumo: "Três trajetórias de atraso em dias ao longo de 12 meses, com linha de 90 dias e máscara do que ainda não foi observado.",
  notas: {
    conducao: [
      "Peça a classificação do contrato C antes de mostrar o status.",
      "Separe explicitamente ainda não aconteceu de não acontecerá dentro da janela.",
      "Leve o controle até o mês 12 e consolide os três elementos: população elegível, evento e horizonte.",
    ],
    respostas: [
      "A atinge 95 dias no mês 8, portanto y = 1.",
      "B fecha os 12 meses com máximo de 88 dias, portanto y = 0.",
      "C tem apenas 6 meses observados e nenhum evento: alvo incompleto, nunca y = 0.",
      "Chegar exatamente a 90 dias não satisfaz superior a 90 dias. No mês 7 o contrato A ainda não tem evento.",
    ],
    cuidados: [
      "Esta é uma definição operacional didática. Não é transcrição de norma bancária.",
      "Mudar o limite de atraso ou o horizonte muda o alvo previsto, e portanto muda o modelo.",
    ],
    transicao: "Agora sabemos o que prever. Precisamos garantir que os dados usados para prever existiam antes do resultado.",
  },
  impressao: function (e) { e.mes = 12; },

  montar: function (corpo, ctx) {
    var est = ctx.estado;
    if (!est.mes) est.mes = 6;

    var contratos = [
      { nome: "Contrato A", serie: [0, 0, 0, 10, 30, 60, 90, 95, 125, 155, 185, 215], observado: 12,
        cor: "var(--alert)" },
      { nome: "Contrato B", serie: [0, 0, 20, 45, 70, 88, 60, 0, 0, 15, 30, 0], observado: 12,
        cor: "var(--ok)" },
      { nome: "Contrato C", serie: [0, 0, 0, 15, 35, 50], observado: 6, cor: "var(--muted)" },
    ];

    function status(c, ate) {
      var limite = Math.min(ate, c.observado);
      var evento = c.serie.slice(0, limite).some(function (v) { return v > 90; });
      var mesEvento = 0;
      c.serie.slice(0, limite).forEach(function (v, i) {
        if (v > 90 && !mesEvento) mesEvento = i + 1;
      });
      if (evento) return { chave: "evento", texto: "evento identificado no mês " + mesEvento + ", y = 1",
                           tipo: "sim" };
      if (limite >= 12) return { chave: "sem", texto: "janela completa sem evento, y = 0", tipo: "ok" };
      return { chave: "incompleto", texto: "janela incompleta, alvo ainda desconhecido", tipo: "neutro" };
    }

    function grafico(c) {
      var g = Graf.novo({ w: 440, h: 246, m: { e: 54, d: 16, c: 14, b: 36 } });
      g.x(0, 12).y(0, 240);
      var ate = Math.min(est.mes, c.observado);
      // máscara do que ainda não foi observado
      var hach = g.hachura("hach" + c.nome.replace(/\s/g, ""), "var(--muted)");
      if (ate < 12) {
        g.retangulo(ate, 0, 12, 240, { cor: hach, opacidade: .9 });
        g.texto(11.9, 222, "ainda não observado",
          { ancora: "end", cor: "var(--muted)", tamanho: 15, peso: 400 });
      }
      g.grade({ y: [90] });
      g.add(sv("line", { x1: g.px(0), x2: g.px(12), y1: g.py(90), y2: g.py(90),
        stroke: "var(--alert)", "stroke-width": 2, "stroke-dasharray": "6 4" }));
      g.texto(0.15, 100, "90 dias", { cor: "var(--alert)", tamanho: 16 });
      g.eixoX({ ticks: [0, 3, 6, 9, 12] });
      g.eixoY({ ticks: [0, 90, 180] });
      var pts = c.serie.slice(0, ate).map(function (v, i) { return [i + 1, v]; });
      if (pts.length) {
        g.linha(pts, { cor: c.cor, largura: 3 });
        pts.forEach(function (p) {
          g.ponto(p[0], p[1], { r: 4, cor: p[1] > 90 ? "var(--alert)" : c.cor, bordaL: 1 });
        });
      }
      return g.svg;
    }

    var cartoes = h("div", { class: "g3 cresce" }, contratos.map(function (c) {
      var s = status(c, est.mes);
      return h("div", { class: "painel claro coluna" }, [
        h("div", { estilo: "display:flex;justify-content:space-between;align-items:baseline" }, [
          h("h3", { class: "secao", estilo: "margin:0" }, c.nome),
          UI.selo(s.chave === "evento" ? "y = 1" : s.chave === "sem" ? "y = 0" : "alvo incompleto",
            s.tipo),
        ]),
        grafico(c),
        h("p", { class: "nota" }, s.texto),
        c.observado < 12
          ? h("p", { class: "nota" }, "Contratado há 6 meses: a janela de 12 meses ainda não terminou.")
          : null,
      ]);
    }));

    var controle = UI.slider({
      rotulo: "Data até a qual conhecemos os dados (mês desde a contratação)",
      min: 3, max: 12, passo: 1, valor: est.mes,
      formato: function (v) { return "mês " + v; },
      aoMudar: function (v) { est.mes = v; App.montar("03"); },
    });

    corpo.appendChild(h("div", { class: "linha topo" }, [
      h("div", { class: "painel cor cresce" }, [
        h("p", { estilo: "font-size:26px;color:var(--ink);margin:0" },
          "Evento: atraso superior a 90 dias em qualquer momento dos 12 meses seguintes à contratação."),
        h("p", { class: "nota", estilo: "margin-top:6px" },
          "População: solicitantes elegíveis, sem inadimplência corrente na proposta. Unidade: um contrato de crédito pessoal."),
      ]),
      h("div", { estilo: "flex:0 0 430px" }, h("div", { class: "painel" }, [
        controle,
        h("p", { class: "nota", estilo: "margin-top:8px" },
          "Atingir exatamente 90 dias não satisfaz a definição. O evento exige mais de 90."),
      ])),
    ]));
    corpo.appendChild(cartoes);
    corpo.appendChild(h("p", { class: "nota", estilo: "text-align:center;margin:0" },
      "Eixo horizontal: meses desde a contratação. Eixo vertical: atraso em dias."));
  },
});

      "Pergunte: podemos escolher o corte depois de ver os resultados finais? Revele que o teste avalia escolhas congeladas.",

      "Calibração e política: ago a dez/2022, alvo completo em dez/2023.",
      "Teste final: fev a jul/2024, alvo completo em jul/2025.",
    ],
    cuidados: [
      "Os espaços entre coortes tornam a maturação visível. Não são uma recomendação universal de desenho operacional.",
      "Divisão aleatória não é sempre inválida. Ela apenas não testa a generalização temporal buscada aqui.",
      "O modelo base é congelado antes da calibração, e a política antes do teste.",
    ],
    transicao: "Agora temos regras de comparação. Como cada técnica transforma os mesmos dados em uma PD?",
  },
  impressao: function (e) { e.cenario = "testar"; },

  montar: function (corpo, ctx) {

    var R = Aula.resultados;
    function anoFrac(iso) {
      var p = iso.split("-");
      return Number(p[0]) + (Number(p[1]) - 1) / 12 + (Number(p[2] || 1) - 1) / 365;
    }

    var faixas = (R ? R.protocolo.particoes : []).map(function (p) {
      return {
        nome: { treino: "Treino", validacao: "Validação de ajuste",

        alvoRotulo: F.mes(p.alvo_conhecido),

Aula.slide({
  id: "11",
  bloco: "logit",
  titulo: "Mais 10 pontos de comprometimento multiplicam as odds por 1,49",

  conclusao: "Uma mudança na variável multiplica as odds. A mudança de PD depende do ponto de partida.",
  fonte: Aula.dados.fontes.manual,
  resumo: "Faixa de cálculo do multiplicador de odds e três pares de barras antes e depois para PDs iniciais de 2%, 10% e 40%.",
  notas: {
    conducao: [
      "Peça que os alunos antecipem a PD quando as odds dobram, começando pelo cenário de 10%.",
      "Revele primeiro 10%, depois 2% e 40%.",
      "Explique que a leitura vale mantidas as outras variáveis do modelo.",
    ],
    respostas: [
      "Com odds multiplicadas por 2: 2% vira aproximadamente 3,92%; 10% vira 18,18%; 40% vira 57,14%.",
      "Com mais 10 pontos de comprometimento, o multiplicador é e elevado a 0,40, aproximadamente 1,4918.",
    ],
    cuidados: [
      "Razão de chances de 1,49 não significa que o risco aumenta 49%.",
      "Para uma mudança finita use a conversão exata, não o efeito marginal local.",
      "A leitura é associativa e condicionada às demais variáveis. Não é efeito causal.",
      "Os três riscos iniciais são cenários didáticos. Não são os quatro clientes.",
    ],
    transicao: "Vamos aplicar essa interpretação a um cliente completo e conferir todas as etapas da conta.",
  },

  montar: function (corpo, ctx) {
    var L = Aula.dados.logit;
    var est = ctx.estado;
    if (est.delta === undefined) est.delta = 10;
    if (!est.modo) est.modo = "comp";

    var beta = L.termos.filter(function (t) { return t.campo === "comp"; })[0].beta;
    var dz = est.modo === "odds2" ? Math.log(2) : beta * est.delta;
    var razao = Math.exp(dz);
    var cenarios = [0.02, 0.10, 0.40];

    var conta = est.modo === "odds2"
      ? ["odds × 2", "Δz = ln(2) = " + F.dec(dz, 4),
         "razão de chances = 2"]
      : ["Δcomp = " + F.sinal(est.delta, 0) + " p.p.",
         "Δz = " + F.dec(beta, 2) + " × " + F.dec(est.delta, 0) + " = " + F.dec(dz, 4),
         "razão de chances = e^" + F.dec(dz, 2) + " ≈ " + F.dec(razao, 4)];

    var gBarras = Graf.novo({ w: 890, h: 430, m: { e: 100, d: 200, c: 30, b: 60 } });
    var maxP = Math.max.apply(null, cenarios.map(function (p) {
      return Math.max(p, M.porRazaoDeOdds(p, razao));
    }));
    var topo = Math.min(1, Math.max(0.6, Math.ceil(maxP * 10) / 10));
    gBarras.x(0, topo).y(0, cenarios.length);
    var ticks = Graf.ticks(0, topo, 6);
    gBarras.grade({ x: ticks });
    gBarras.eixoX({ ticks: ticks, formato: function (v) { return F.pct(v, 0); },
                    rotulo: "probabilidade de inadimplência" });
    var alt = (gBarras.altura / cenarios.length) * 0.24;
    cenarios.forEach(function (p, i) {
      var novo = M.porRazaoDeOdds(p, razao);
      var yc = gBarras.py(cenarios.length - i - 0.5);
      [[p, "antes", "var(--rule)", -1], [novo, "depois", "var(--logit)", 1]].forEach(function (par) {
        var y = yc + par[3] * alt * 0.62;
        gBarras.add(sv("rect", { x: gBarras.px(0), y: y - alt / 2,
          width: Math.max(2, gBarras.px(par[0]) - gBarras.px(0)), height: alt,
          fill: par[2], rx: 2 }));
        gBarras.add(sv("text", { x: gBarras.px(par[0]) + 10, y: y + 7, "font-size": 19,
          "font-weight": 700, fill: "var(--ink)", texto: F.pct(par[0], 2) + "  " + par[1] }));
      });
      gBarras.add(sv("text", { x: gBarras.m.e - 14, y: yc - 2, "text-anchor": "end",
        "font-size": 21, "font-weight": 700, fill: "var(--ink)",
        texto: "PD inicial " + F.pct(p, 0) }));
      gBarras.add(sv("text", { x: gBarras.m.e - 14, y: yc + 22, "text-anchor": "end",
        "font-size": 18, fill: "var(--muted)",
        texto: F.ppSinal(novo - p, 2) }));
    });

    var tabela = UI.tabela({
      compacta: true,
      colunas: [{ rotulo: "PD inicial" }, { rotulo: "Odds antes" }, { rotulo: "Odds depois" },
                { rotulo: "PD depois" }, { rotulo: "Diferença", unidade: "p.p." }],
      linhas: cenarios.map(function (p) {
        var novo = M.porRazaoDeOdds(p, razao);
        return [F.pct(p, 0), F.dec(M.odds(p), 4), F.dec(M.odds(p) * razao, 4),
                F.pct(novo, 2), F.ppSinal(novo - p, 2)];
      }),
      legenda: "Conversão exata de odds para probabilidade em três pontos de partida",
    });

    function intercepto() { return zBase + efeito[est.ref]; }

        "Nada nos dados garante isso."),

            "z = " + F.dec(intercepto(), 2) +

              return " + " + F.dec(coef(c), 2) + " × [" + c.toLowerCase() + "]";
            }).join("")),
        ]),
        h("div", { class: "painel claro cresce" }, tabela),
        erro,
      ]),
      h("div", { class: "coluna", estilo: "flex:0 0 660px" }, [
        h("div", { class: "painel claro" }, gb.svg),
        h("div", { class: "painel" }, [
          h("div", { class: "ctrl" }, [
            h("label", {}, "Canal do cliente"),
            UI.botoes({

          h("div", { class: "grupo", estilo: "margin-top:12px" }, [
            UI.botoes({
              compacto: true, rotulo: "categoria de referência",

        "Bruno sem o histórico de atraso, mantendo comprometimento em " +
        F.dec(bruno.comp, 0) + "% e os demais valores originais: escore " +
        F.dec(L.z(semHist), 3) + " e PD " + F.pct(M.sigmoid(L.z(semHist)), 2) + "."),
      h("p", { class: "nota" },
        "Este é um segundo cenário, independente do aumento de comprometimento."),
    ]);

    corpo.appendChild(h("div", { class: "linha cresce" }, [
      h("div", { class: "coluna", estilo: "flex:0 0 430px" }, [
        Comum.ficha(bruno, { cor: true, selo: "perfil original",
          rodape: "Uma única alteração: comprometimento de " + F.dec(bruno.comp, 0) +
                  "% para " + F.dec(novo.comp, 0) + "%." }),
        h("div", { class: "painel claro cresce" }, [
          h("h3", { class: "secao" }, "Revisão rápida"),
          h("div", { class: "grupo vert" }, [
            h("button", { class: "btn min fantasma", type: "button",
              onclick: function () { ctx.ir("11"); } },
              "Rever a razão de chances (slide 11)"),
            h("button", { class: "btn min fantasma", type: "button",
              onclick: function () { ctx.ir("12"); } },
              "Rever a calculadora de PD (slide 12)"),
          ]),
          h("p", { class: "nota", estilo: "margin-top:8px" },
            "A escolha feita aqui é preservada ao voltar."),
        ]),
      ]),
      h("div", { class: "coluna cresce" }, [
        h("div", { class: "painel claro cresce" }, [
          h("h3", { class: "secao" }, "Escolha uma alternativa"),
          quiz,
        ]),
        h("div", { class: "grupo" }, [
          h("button", { class: "btn", type: "button", onclick: function () {
            est.passos = Math.min(etapas.length, est.passos + 1); App.montar("20");
          }, disabled: est.passos >= etapas.length },
            est.passos ? "Próxima etapa da solução" : "Resolver passo a passo"),
          h("button", { class: "btn", type: "button", onclick: function () {
            est.desafio = !est.desafio; App.montar("20");
          } }, est.desafio ? "Esconder o desafio" : "Desafio opcional"),
          h("button", { class: "btn fantasma", type: "button", onclick: ctx.reiniciar },
            "Reiniciar exercício"),
        ]),
      ]),
      h("div", { class: "coluna", estilo: "flex:0 0 470px" }, [
        solucao,
        desafio,
      ]),
    ]));

});


/* nucleo/90-app.js */
/* Motor da apresentação: navegação, modos, estado por slide e impressão.
   Regra de estado: a exploração de um slide é preservada enquanto a sessão
   estiver aberta; "Reiniciar exemplo" devolve o slide ao estado inicial.
   Abrir uma URL explícita prevalece sobre o slide guardado. */

var App = (function () {
  var estados = {};
  var atual = null;
  var professor = false;
  var estudo = false;
  var LARGURA_ESTUDO = 1100;

  function ordem() { return Aula.slides; }
  function indiceDe(id) {
    for (var i = 0; i < Aula.slides.length; i++) if (Aula.slides[i].id === id) return i;
    return -1;
  }

  function estadoDe(id) {
    if (!estados[id]) estados[id] = {};
    return estados[id];
  }

  /* --------------------------------------------------------------- render */

  function montar(id) {
    var def = Aula.registro[id];
    if (!def) { id = Aula.slides[0].id; def = Aula.registro[id]; }
    atual = id;
    document.body.setAttribute("data-bloco", def.bloco);

    var palco = document.getElementById("palco");
    limpar(palco);

    var n = indiceDe(id) + 1;
    var cabeca = h("header", { class: "cabeca" }, [
      h("div", { class: "trilho" }, [
        h("span", {}, Aula.dados.blocos[def.bloco]),
        h("span", { class: "passo" }, "slide " + def.id + " de 50"),
      ]),
      h("h1", { class: "titulo" }, def.titulo),
      def.subtitulo ? h("p", { class: "subtitulo" }, def.subtitulo) : null,
    ]);
    var corpo = h("div", { id: "corpo" });
    var rodape = h("footer", { class: "rodape" }, [
      h("p", { class: "conclusao" }, def.conclusao || ""),
      h("p", { class: "fonte" }, def.fonte || ""),
    ]);
    palco.appendChild(cabeca);
    palco.appendChild(corpo);
    palco.appendChild(rodape);

    if (def.resumo) corpo.appendChild(UI.resumoGrafico(def.resumo));

    var ctx = {
      estado: estadoDe(id),
      professor: professor,
      estudo: estudo,
      reiniciar: function () { estados[id] = {}; montar(id); },
      ir: function (outro) { navegar(outro); },
      impressao: false,
    };
    try {
      def.montar(corpo, ctx);
    } catch (e) {
      corpo.appendChild(h("p", { class: "resposta erro" },
        "Falha ao montar o slide " + id + ": " + e.message));
      if (window.console) console.error(e);
    }

    atualizarBarra(def, n);
    atualizarNotas(def);
    atualizarIndice();
    if (estudo) montarNotasEstudo(def);
    escalar();
  }

  function montarNotasEstudo(def) {
    var velho = document.getElementById("estudo-notas");
    if (velho) velho.parentNode.removeChild(velho);
    if (!def.notas) return;
    var caixa = h("section", { id: "estudo-notas", class: "estudo-notas" },
      h("div", { class: "painel" }, [
        h("h3", { class: "secao" }, "Notas do professor e aprofundamento"),
        blocosDeNotas(def),
      ]));
    document.getElementById("moldura").appendChild(caixa);
  }

  function blocosDeNotas(def) {
    var itens = [];
    var mapa = [
      ["conducao", "Condução em aula"],
      ["respostas", "Respostas"],
      ["cuidados", "Cuidados e limites"],
      ["aprofundar", "Aprofundamento"],
    ];
    mapa.forEach(function (par) {
      var v = def.notas && def.notas[par[0]];
      if (!v || !v.length) return;
      itens.push(h("h3", {}, par[1]));
      itens.push(h("ul", {}, v.map(function (t) { return h("li", {}, t); })));
    });
    if (def.notas && def.notas.transicao) {
      itens.push(h("h3", {}, "Transição"));
      itens.push(h("p", {}, def.notas.transicao));
    }
    return h("div", {}, itens);
  }

  function atualizarNotas(def) {
    var cx = document.getElementById("notas");
    limpar(cx);
    cx.appendChild(h("h2", {}, def.id + " · " + def.titulo));
    cx.appendChild(h("p", { class: "nota" }, def.fonte || ""));
    cx.appendChild(blocosDeNotas(def));
  }

  function atualizarBarra(def, n) {
    document.getElementById("rotulo-id").textContent = def.id + "/50";
    document.getElementById("rotulo-titulo").textContent = def.titulo;
    document.getElementById("progresso-barra").style.width =
      ((n / Aula.slides.length) * 100).toFixed(2) + "%";
    var ant = document.getElementById("btn-anterior");
    var pro = document.getElementById("btn-proximo");
    ant.disabled = n <= 1;
    pro.disabled = n >= Aula.slides.length;
  }

  function atualizarIndice() {
    var cx = document.getElementById("indice-lista");
    if (cx.childElementCount) {
      [].forEach.call(cx.querySelectorAll("a"), function (a) {
        a.classList.toggle("atual", a.getAttribute("data-id") === atual);
      });
      return;
    }
    var porBloco = {};
    Aula.slides.forEach(function (s) {
      (porBloco[s.bloco] = porBloco[s.bloco] || []).push(s);
    });
    Object.keys(Aula.dados.blocos).forEach(function (b) {
      if (!porBloco[b]) return;
      var lista = h("div", { class: "indice-lista" }, porBloco[b].map(function (s) {
        return h("a", {
          href: "#/slide/" + s.id, "data-id": s.id,
          class: s.id === atual ? "atual" : "",
          onclick: function () { fecharIndice(); },
        }, [h("b", {}, s.id), h("span", {}, s.titulo)]);
      }));
      cx.appendChild(h("div", { class: "indice-bloco" }, [
        h("h3", {}, Aula.dados.blocos[b]), lista,
      ]));
    });
  }

  /* ------------------------------------------------------------ navegação */

  function navegar(id) {
    if (!Aula.registro[id]) return;
    if (location.hash !== "#/slide/" + id) {
      location.hash = "#/slide/" + id;
    } else {
      montar(id);
    }
  }
  function passo(d) {
    var i = indiceDe(atual) + d;
    if (i < 0 || i >= Aula.slides.length) return;
    navegar(Aula.slides[i].id);
  }

  function doHash() {
    var m = /^#\/slide\/(\d{2})$/.exec(location.hash || "");
    var id = m ? m[1] : (localStorage.getItem("aula-credito-slide") || "01");
    if (!Aula.registro[id]) id = "01";
    montar(id);
    try { localStorage.setItem("aula-credito-slide", id); } catch (e) { /* sem persistência */ }
  }

  /* ---------------------------------------------------------------- modos */

  function alternarProfessor(v) {
    professor = v === undefined ? !professor : v;
    document.getElementById("notas").hidden = !professor;
    document.getElementById("btn-professor").classList.toggle("ativo", professor);
    document.getElementById("btn-professor").setAttribute("aria-pressed", professor ? "true" : "false");
    escalar();
  }

  function alternarEstudo(v) {
    estudo = v === undefined ? !estudo : v;
    document.body.classList.toggle("estudo", estudo);
    document.getElementById("btn-estudo").classList.toggle("ativo", estudo);
    document.getElementById("btn-estudo").setAttribute("aria-pressed", estudo ? "true" : "false");
    var velho = document.getElementById("estudo-notas");
    if (velho) velho.parentNode.removeChild(velho);
    montar(atual);
  }

  function telaCheia() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () { /* recusado */ });
    }
  }

  function abrirIndice() {
    document.getElementById("indice").hidden = false;
    var a = document.querySelector("#indice-lista a.atual") || document.querySelector("#indice-lista a");
    if (a) a.focus();
  }
  function fecharIndice() { document.getElementById("indice").hidden = true; }

  /* ------------------------------------------------------------- escala */

  function escalar() {
    if (estudo) return;
    var palco = document.getElementById("palco");
    var moldura = document.getElementById("moldura");
    var lados = professor && moldura.clientWidth > 1200 ? 430 : 0;
    var k = Math.min((moldura.clientWidth - lados - 16) / 1600,
                     (moldura.clientHeight - 16) / 900);
    palco.style.transform = "scale(" + k.toFixed(4) + ")";
    palco.style.marginRight = lados ? lados + "px" : "0";
  }

  function checarLargura() {
    var estreito = window.innerWidth < LARGURA_ESTUDO;
    if (estreito && !estudo) alternarEstudo(true);
    else escalar();
  }

  /* ----------------------------------------------------------- impressão */

  function prepararImpressao() {
    var cx = document.getElementById("impressao");
    limpar(cx);
    Aula.slides.forEach(function (def) {
      var folha = h("article", { class: "folha" });
      folha.appendChild(h("div", { class: "trilho" }, [
        h("span", {}, Aula.dados.blocos[def.bloco]),
        h("span", { class: "passo" }, " slide " + def.id + " de 50"),
      ]));
      folha.appendChild(h("h1", { class: "titulo" }, def.titulo));
      if (def.subtitulo) folha.appendChild(h("p", { class: "subtitulo" }, def.subtitulo));
      var corpo = h("div", { class: "corpo" });
      folha.appendChild(corpo);
      var est = JSON.parse(JSON.stringify(estadoDe(def.id)));
      if (def.impressao) def.impressao(est);
      try {
        def.montar(corpo, {
          estado: est, professor: true, estudo: false, impressao: true,
          reiniciar: function () {}, ir: function () {},
        });
      } catch (e) {
        corpo.appendChild(h("p", {}, "Slide não renderizado para impressão: " + e.message));
      }
      folha.appendChild(h("p", { class: "conclusao" }, def.conclusao || ""));
      folha.appendChild(h("p", { class: "fonte" }, def.fonte || ""));
      if (def.notas) {
        folha.appendChild(h("div", { class: "painel", estilo: "margin-top:8px" }, [
          h("h3", { class: "secao" }, "Notas e respostas"), blocosDeNotas(def),
        ]));
      }
      cx.appendChild(folha);
    });
  }

  /* ------------------------------------------------------------- teclado */

  function editando(alvo) {
    if (!alvo) return false;
    var t = (alvo.tagName || "").toLowerCase();
    return t === "input" || t === "textarea" || t === "select" || alvo.isContentEditable;
  }

  function teclado(e) {
    if (e.defaultPrevented) return;
    if (e.key === "Escape") {
      if (!document.getElementById("indice").hidden) { fecharIndice(); return; }
    }
    if (editando(e.target)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    switch (e.key) {
      case "ArrowRight": case "PageDown": passo(1); e.preventDefault(); break;
      case "ArrowLeft": case "PageUp": passo(-1); e.preventDefault(); break;
      case "Home": navegar(Aula.slides[0].id); e.preventDefault(); break;
      case "End": navegar(Aula.slides[Aula.slides.length - 1].id); e.preventDefault(); break;
      case "p": case "P": alternarProfessor(); break;
      case "e": case "E": alternarEstudo(); break;
      case "f": case "F": telaCheia(); break;
      case "i": case "I":
        if (document.getElementById("indice").hidden) abrirIndice(); else fecharIndice();
        break;
      default: break;
    }
  }

  /* --------------------------------------------------------------- início */

  function iniciar() {
    document.getElementById("btn-anterior").addEventListener("click", function () { passo(-1); });
    document.getElementById("btn-proximo").addEventListener("click", function () { passo(1); });
    document.getElementById("btn-indice").addEventListener("click", abrirIndice);
    document.getElementById("btn-fechar-indice").addEventListener("click", fecharIndice);
    document.getElementById("btn-professor").addEventListener("click", function () { alternarProfessor(); });
    document.getElementById("btn-estudo").addEventListener("click", function () { alternarEstudo(); });
    document.getElementById("btn-tela").addEventListener("click", telaCheia);
    document.getElementById("btn-imprimir").addEventListener("click", function () {
      prepararImpressao();
      setTimeout(function () { window.print(); }, 60);
    });
    window.addEventListener("hashchange", doHash);
    window.addEventListener("resize", checarLargura);
    window.addEventListener("keydown", teclado);
    window.addEventListener("beforeprint", function () {
      if (!document.getElementById("impressao").childElementCount) prepararImpressao();
    });
    if (window.innerWidth < LARGURA_ESTUDO) {
      estudo = true;
      document.body.classList.add("estudo");
      document.getElementById("btn-estudo").classList.add("ativo");
    }
    doHash();
    escalar();
  }

  return {
    iniciar: iniciar, navegar: navegar, montar: montar, estadoDe: estadoDe,
    prepararImpressao: prepararImpressao, escalar: escalar,
  };
})();

document.addEventListener("DOMContentLoaded", function () {
  if (Aula.slides.length !== 50 && window.console) {
    console.warn("slides registrados: " + Aula.slides.length);
  }
  App.iniciar();
});
